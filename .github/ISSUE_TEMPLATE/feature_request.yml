name: Feature Request
description: Suggest a new feature or enhancement for UEFNiVERSE
title: "[FEATURE] "
labels: ["enhancement", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Help us understand your idea by filling out the sections below.

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature Type
      description: What type of feature are you requesting?
      options:
        - New Device
        - Enhancement to existing device
        - Core improvement (base_device, persistence, utilities)
        - Documentation improvement
        - Other
    validations:
      required: true

  - type: dropdown
    id: affected-device
    attributes:
      label: Related Device (if applicable)
      description: Which device is this feature for?
      options:
        - Core (base_device, base_group_device, Saved_Data, utility)
        - Device1 - Shared Progress Tracker
        # - Device2 - Team Buff Zone
        # - Device3 - Advanced Revive System
        - New device concept
        - Multiple devices
        - Not applicable
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What's currently missing or difficult?
      placeholder: "Currently there's no way to track player achievements across multiple game sessions..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would this feature work? Be as detailed as possible.
      placeholder: |
        Add a new Device4: Achievement System that:
        - Tracks global player milestones
        - Persists across all game modes
        - Awards badges and XP
        - Integrates with existing devices
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Provide real-world examples of how this would be used
      placeholder: |
        1. Track total eliminations across all matches
        2. Award "100 eliminations" badge
        3. Display achievements in player profiles
        4. Unlock cosmetics based on achievements
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you thought about?
      placeholder: |
        - Extend Device1 with achievement tracking (too complex)
        - Manual tracking with custom code (defeats reusability)
        - Use external database (not UEFN-native)

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Examples
      description: Add mockups, diagrams, or examples from other systems (drag and drop images)

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      description: Help us prioritize features
      options:
        - Nice to have
        - Would improve my workflow
        - Critical for my project
        - Blocking my development
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else we should know?

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues and discussions
          required: true
        - label: This feature aligns with UEFNiVERSE's core architecture principles
          required: false
        - label: I would be willing to help implement or test this feature
          required: false
